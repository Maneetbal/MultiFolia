name: Build MultiFolia

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Configure Git User Details
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Folia Patches
        run: timeout 10m gradle --no-daemon applyAllPatches --stacktrace

      - name: Build MultiFolia
        run: timeout 10m gradle --no-daemon build --stacktrace

      - name: Build runnable Paperclip JAR
        run: timeout 10m gradle --no-daemon createPaperclipJar --stacktrace

      - name: Package MultiFolia distribution
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/multifolia-node dist/multifolia-server

          # A node is a runnable MultiFolia server process. Package the same
          # validated Paperclip runtime in both deployment locations so a node
          # can actually be launched with java -jar.
          mapfile -t PAPERCLIP_JARS < <(find folia-server/build/libs -maxdepth 1 -type f -iname '*paperclip*.jar' -print | sort)
          test "${#PAPERCLIP_JARS[@]}" -eq 1
          printf 'Using Paperclip JAR: %s\n' "${PAPERCLIP_JARS[0]}"
          printf '%s\n' 'Paperclip source manifest:'
          unzip -p "${PAPERCLIP_JARS[0]}" META-INF/MANIFEST.MF
          cp "${PAPERCLIP_JARS[0]}" dist/multifolia-node/multifolia-node.jar
          cp "${PAPERCLIP_JARS[0]}" dist/multifolia-server/multifolia-server.jar
          cp distribution/multifolia-node/README.md dist/multifolia-node/README.md
          cp distribution/multifolia-server/README.md dist/multifolia-server/README.md

          printf '%s\n' \
            'MultiFolia 26.2 distribution' \
            '' \
            'multifolia-node/: runnable MultiFolia/Folia 26.2 node Paperclip JAR' \
            'multifolia-server/: runnable MultiFolia/Folia 26.2 Paperclip server JAR' \
            '' \
            'Use JDK 25. Each node needs its own server directory and world storage.' \
            > dist/README.txt

      - name: Verify packaged distribution
        run: |
          set -euo pipefail
          test -f dist/README.txt
          test -f dist/multifolia-node/README.md
          test -f dist/multifolia-server/README.md
          test -f dist/multifolia-node/multifolia-node.jar
          test -f dist/multifolia-server/multifolia-server.jar
          test "$(find dist/multifolia-node -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          test "$(find dist/multifolia-server -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1

          # Validate both packaged launchable JARs and their Java launcher metadata.
          for jar in dist/multifolia-node/multifolia-node.jar dist/multifolia-server/multifolia-server.jar; do
            unzip -t "$jar" >/dev/null
            manifest="$(unzip -p "$jar" META-INF/MANIFEST.MF)"
            printf '%s\n' "Manifest for $jar:"
            printf '%s\n' "$manifest"
            printf '%s\n' "$manifest" | grep -Eq '^Manifest-Version: .+$'
            printf '%s\n' "$manifest" | grep -Eq '^Main-Class: .+$'
          done

          find dist -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Smoke test packaged server and management commands
        run: |
          set -euo pipefail
          rm -rf smoke-test
          mkdir smoke-test
          cp dist/multifolia-server/multifolia-server.jar smoke-test/server.jar
          printf 'eula=true\n' > smoke-test/eula.txt
          printf 'online-mode=false\n' > smoke-test/server.properties

          cd smoke-test
          set +e
          printf '%s\n' \
            'multifolia' \
            'multifolia servers' \
            'mf list' \
            'mf debug' \
            'multifolia map' \
            'stop' \
            | timeout 60s java -Xms512M -Xmx1G -jar server.jar --nogui > server.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat server.log
            exit "$status"
          fi

          cat server.log
          grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' server.log
          grep -Eq 'MultiFolia management' server.log
          grep -Eq 'MultiFolia workers \(1\)' server.log
          grep -Eq 'local-server' server.log
          grep -Eq 'MultiFolia distributed state' server.log
          grep -Eq 'Distributed transport: .*NOT IMPLEMENTED' server.log
          grep -Eq 'MultiFolia region map' server.log
          echo 'Packaged server and MultiFolia management commands passed runtime smoke test.'

      - name: Smoke test packaged node launcher
        run: |
          set -euo pipefail
          rm -rf node-smoke-test
          mkdir node-smoke-test
          cp dist/multifolia-node/multifolia-node.jar node-smoke-test/node.jar
          printf 'eula=true\n' > node-smoke-test/eula.txt
          printf 'online-mode=false\n' > node-smoke-test/server.properties

          cd node-smoke-test
          set +e
          printf '%s\n' 'stop' | timeout 60s java -Xms512M -Xmx1G -jar node.jar --nogui > node.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat node.log
            exit "$status"
          fi

          cat node.log
          grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' node.log
          echo 'Packaged MultiFolia node launcher passed runtime smoke test.'

      - name: Upload MultiFolia distribution
        uses: actions/upload-artifact@v7
        with:
          name: multifolia
          path: dist/
          if-no-files-found: error
