name: Build MultiFolia

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Configure Git User Details
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply Folia Patches
        run: timeout 10m gradle --no-daemon applyAllPatches --stacktrace

      - name: Build MultiFolia
        run: timeout 10m gradle --no-daemon build --stacktrace

      - name: Upload MultiFolia artifacts
        uses: actions/upload-artifact@v7
        with:
          name: multifolia
          path: |
            folia-server/build/libs/*.jar
            folia-api/build/libs/*.jar
