name: Convert MultiFolia to Folia 26.2

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'conversion/folia-26.2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Import official Folia ver/26.2.x
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' /tmp/folia/ ./
          rm -rf /tmp/folia
          # Keep this conversion workflow present after the upstream import, which removes non-Folia files.
          git show origin/main:.github/workflows/multifolia-convert.yml > .github/workflows/multifolia-convert.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          p.write_text(p.read_text().replace('rootProject.name = "folia"', 'rootProject.name = "multifolia"'), encoding='utf-8')
          p = Path('gradle.properties')
          p.write_text(p.read_text().replace('group=dev.folia', 'group=dev.multifolia'), encoding='utf-8')
          PY
          rm -rf multipaper-api multipaper-server multipaper-master multipaper-mastermessagingprotocol
          rm -f assets/multifolia-diagram.jpg DEVELOPING_A_MULTISERVER_PLUGIN.md
          rmdir assets 2>/dev/null || true
          test -d folia-api
          test -d folia-server
          test -d folia-checkstyle
          test -d build-data
          grep -q '^mcVersion=26.2$' gradle.properties
          grep -q '^apiVersion=26.2$' gradle.properties
          grep -q '^paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746$' gradle.properties
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace
          if grep -RniE 'multipaper|MultiPaper|MULTIPAPER' . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build; then exit 1; fi
          git config user.email 'no-reply@github.com'
          git config user.name 'Github Actions'
          git add -A
          git commit -m 'Replace MultiPaper foundation with Folia 26.2'
          git push origin HEAD:conversion/folia-26.2
