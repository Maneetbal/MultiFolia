name: Bootstrap MultiFolia conversion

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  convert:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replace repository with official Folia 26.2.x tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' /tmp/folia/ ./
          rm -rf /tmp/folia

          python3 - <<'PY'
          from pathlib import Path

          Path('settings.gradle.kts').write_text(Path('settings.gradle.kts').read_text().replace('rootProject.name = "folia"', 'rootProject.name = "multifolia"'), encoding='utf-8')
          Path('gradle.properties').write_text(Path('gradle.properties').read_text().replace('group=dev.folia', 'group=dev.multifolia'), encoding='utf-8')

          Path('README.md').write_text('''# MultiFolia

MultiFolia is a genuine Folia 26.2 fork. The server engine remains Folia's regionized multithreading architecture; MultiFolia adds an isolated distributed control plane intended for eventual multi-machine region ownership.

## Foundation

The source tree is imported from `PaperMC/Folia` branch `ver/26.2.x`. Folia's RegionScheduler, EntityScheduler, GlobalRegionScheduler, AsyncScheduler, threaded regions, and region ownership/thread-context checks remain the execution model. MultiFolia does not retain the MultiPaper server/master/messaging architecture.

## Target

- Minecraft 26.2
- Java 25
- Group: `dev.multifolia`
- Upstream: `PaperMC/Folia` `ver/26.2.x`

## Distributed layer

Phase 1 is deliberately safe and incremental. `dev.multifolia.distributed` provides in-process worker registry, health state, region ownership leases, and fencing tokens. It does not perform shared-world concurrent writes, copied-world synchronization, or unsafe cross-worker mutation.

The production target is Folia regions distributed across physical workers, with authenticated discovery, single-writer ownership, state transfer, region handoff, cross-region routing, failure fencing, and recovery. Those stages will only be enabled once they preserve Folia's region thread ownership rules.

Syncthing/shared files are not used as a live world synchronization mechanism.

## Commands

The management namespace is `/multifolia` (optional `/mf`) with planned `servers`, `list`, `debug`, and `map` subcommands. Command registration will be layered into the server without disabling Folia safety checks.

## Plugins

MultiFolia expects Folia-compatible plugins. Paper compatibility is not assumed automatically. Priority targets include AuthMe, CombatLog, EasyHome, EzRTP, Floodgate, Geyser, GrimAC, LuckPerms, PacketEvents, PASF, PlaceholderAPI, RaycastedAntiESP, SkinsRestorer, SnowballDamage, TAB, ViaBackwards, and ViaVersion. Axiom is intentionally excluded.

## Build

```bash
./gradlew applyAllPatches
./gradlew build
```
''', encoding='utf-8')

          Path('MULTIFOLIA_DISTRIBUTED_ARCHITECTURE.md').write_text('''# MultiFolia distributed architecture

## Safety invariants

- Folia remains the authoritative server engine.
- One worker may hold the active lease for a region at a time.
- Every lease acquisition receives a fencing token.
- Stale workers cannot renew or release a lease without the correct token.
- Region execution must continue under Folia's thread-context rules.
- No worker directly writes another worker's live region files.
- Ownership transfer requires an explicit state-transfer protocol and acknowledgement before a new owner starts mutation.

## Current phase

The repository currently contains only the local control-plane primitives: worker registration/health and thread-safe region lease/fencing state. Networking, durable state transfer, cross-worker routing, region handoff, failure detection, and recovery are intentionally not enabled yet.
''', encoding='utf-8')
