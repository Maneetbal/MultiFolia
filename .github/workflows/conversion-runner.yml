name: Materialize Folia 26.2 Conversion

on:
  push:
    branches:
      - conversion/folia-26.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Git identity
        run: |
          git config --global user.email 'no-reply@github.com'
          git config --global user.name 'MultiFolia Automation'
      - name: Import official Folia 26.2.x
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/folia
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' /tmp/folia/ ./
          rm -rf /tmp/folia
          mkdir -p .github/multifolia
          git show origin/main:.github/multifolia/management-command.patch > .github/multifolia/management-command.patch
          git show origin/main:.github/multifolia/distributed-control-plane.java > /tmp/distributed-control-plane.java
          mkdir -p folia-server/src/main/java/dev/multifolia/distributed
          cp /tmp/distributed-control-plane.java folia-server/src/main/java/dev/multifolia/distributed/MultiFoliaDistributedControlPlane.java
          git show origin/main:.github/workflows/conversion-runner.yml > .github/workflows/conversion-runner.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          p.write_text(p.read_text(encoding='utf-8').replace('rootProject.name = "folia"', 'rootProject.name = "multifolia"'), encoding='utf-8')
          p = Path('gradle.properties')
          text = p.read_text(encoding='utf-8').replace('group=dev.folia', 'group=dev.multifolia')
          text = text.replace('paperRef=5563e58283f7771bd5ace9baad8b68614e37ad16', 'paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746')
          p.write_text(text, encoding='utf-8')
          Path('README.md').write_text('''# MultiFolia\n\nMultiFolia is a Folia 26.2 fork. Folia remains the execution engine and its regionized multithreading, schedulers, and thread-ownership checks are preserved.\n\n## Version\n\n- Minecraft 26.2\n- Java 25\n- Base: `PaperMC/Folia` `ver/26.2.x`\n\n## Distributed foundation\n\nThe first phase is a conservative control plane for worker registration, health, single-writer region leases, and fencing. Cross-worker world-file replication and shared live-region writes are not enabled. Future handoff must preserve Folia ownership semantics.\n\n## Management commands\n\n`/multifolia` and `/mf` expose `servers`, `list`, `debug`, and `map` as management/diagnostic commands. They do not bypass Folia scheduling or thread checks.\n\n## Plugin policy\n\nTarget plugins are Folia-compatible: AuthMe, CombatLog, EasyHome, EzRTP, Floodgate, Geyser, GrimAC, LuckPerms, PacketEvents, PASF, PlaceholderAPI, RaycastedAntiESP, SkinsRestorer, SnowballDamage, TAB, ViaBackwards, ViaVersion. Axiom is excluded.\n''', encoding='utf-8')
          PY
          cp .github/multifolia/management-command.patch folia-server/paper-patches/features/0007-MultiFolia-management-command.patch
          rm -rf multipaper-api multipaper-server multipaper-master multipaper-mastermessagingprotocol
          rm -f DEVELOPING_A_MULTISERVER_PLUGIN.md assets/multifolia-diagram.jpg
          rmdir assets 2>/dev/null || true
          test -d folia-api
          test -d folia-server
          test -d folia-checkstyle
          test -d build-data
          test ! -d multipaper-api
          test ! -d multipaper-server
          test ! -d multipaper-master
          test ! -d multipaper-mastermessagingprotocol
          grep -q '^mcVersion=26.2$' gradle.properties
          grep -q '^apiVersion=26.2$' gradle.properties
          grep -q '^paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746$' gradle.properties
          grep -Rql 'RegionScheduler' folia-api folia-server
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace
          if grep -RniE 'multipaper|MultiPaper|MULTIPAPER' . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build; then
            echo 'Forbidden MultiPaper references remain'
            exit 1
          fi
          rm -rf .github/multifolia
          git add -A
          git commit -m 'Materialize Folia 26.2 conversion' || true
          git push origin HEAD:conversion/folia-26.2
