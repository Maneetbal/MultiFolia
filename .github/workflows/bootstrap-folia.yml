name: Materialize Folia 26.2 Conversion
on:
  push:
    branches: [conversion/folia-26.2]
  workflow_dispatch:
concurrency:
  group: multifolia-materialize
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Git identity
        run: |
          git config --global user.email 'no-reply@github.com'
          git config --global user.name 'MultiFolia Automation'
      - name: Import official Folia 26.2.x
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' /tmp/folia/ ./
          rm -rf /tmp/folia
      - name: Run MultiFolia materializer
        run: |
          set -euo pipefail
          git show origin/main:.github/multifolia/materialize.sh > /tmp/materialize.sh
          chmod +x /tmp/materialize.sh
          /tmp/materialize.sh
