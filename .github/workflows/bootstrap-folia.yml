name: Materialize Folia 26.2 Conversion

on:
  push:
    branches:
      - conversion/folia-26.2
  workflow_dispatch:

concurrency:
  group: multifolia-materialize
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Git identity
        run: |
          git config --global user.email 'no-reply@github.com'
          git config --global user.name 'MultiFolia Automation'
      - name: Import upstream Folia 26.2.x
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' /tmp/folia/ ./
          rm -rf /tmp/folia
          mkdir -p folia-server/src/main/java/dev/multifolia/distributed folia-server/src/test/java/dev/multifolia/distributed
          git show origin/main:.github/multifolia/distributed-control-plane.java > folia-server/src/main/java/dev/multifolia/distributed/MultiFoliaDistributedControlPlane.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('settings.gradle.kts')
          p.write_text(p.read_text(encoding='utf-8').replace('rootProject.name = "folia"', 'rootProject.name = "multifolia"'), encoding='utf-8')
          p = Path('gradle.properties')
          p.write_text(p.read_text(encoding='utf-8').replace('group=dev.folia', 'group=dev.multifolia').replace('paperRef=5563e58283f7771bd5ace9baad8b68614e37ad16', 'paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746'), encoding='utf-8')
          Path('README.md').write_text('''# MultiFolia\n\nMultiFolia is a genuine Folia 26.2 fork. Folia remains the execution engine and its regionized multithreading, schedulers, and thread-ownership checks remain authoritative.\n\nThe distributed layer starts as a conservative control plane for worker registration, health, and single-writer region leases with fencing. Cross-worker live-region writes and world-file replication are disabled until safe state transfer exists.\n\nThe management namespace is `/multifolia` with alias `/mf`; management operations must remain observational/control-plane only.\n\nPriority Folia-compatible plugins: AuthMe, CombatLog, EasyHome, EzRTP, Floodgate, Geyser, GrimAC, LuckPerms, PacketEvents, PASF, PlaceholderAPI, RaycastedAntiESP, SkinsRestorer, SnowballDamage, TAB, ViaBackwards, ViaVersion. Axiom is excluded.\n''', encoding='utf-8')
          Path('MULTIFOLIA_DISTRIBUTED_ARCHITECTURE.md').write_text('''# MultiFolia distributed architecture\n\nFolia remains authoritative for execution and thread ownership. Exactly one worker owns a region at a time, each lease grant gets a monotonic fencing token, and stale owners cannot renew or release. Workers never write another worker's live region files. Handoff requires explicit state transfer and acknowledgement.\n\nThe current phase is only an in-process control plane. Network transport, persistent state transfer, routing, and failure recovery remain disabled until they can be integrated without bypassing Folia ownership semantics.\n''', encoding='utf-8')
          PY
          cat > folia-server/src/test/java/dev/multifolia/distributed/MultiFoliaDistributedControlPlaneTest.java <<'EOF'
          package dev.multifolia.distributed;
          import static org.junit.jupiter.api.Assertions.*;
          import java.time.Duration;
          import org.junit.jupiter.api.Test;
          class MultiFoliaDistributedControlPlaneTest {
              @Test void ownershipIsSingleWriterAndFenced() {
                  var cp = new MultiFoliaDistributedControlPlane();
                  cp.registerWorker("a", "local-a");
                  cp.registerWorker("b", "local-b");
                  var key = new MultiFoliaDistributedControlPlane.RegionKey("minecraft:overworld", 1, 2);
                  var first = cp.tryAcquire(key, "a", Duration.ofSeconds(5)).orElseThrow();
                  assertTrue(cp.tryAcquire(key, "b", Duration.ofSeconds(5)).isEmpty());
                  assertTrue(cp.release(key, "a", first.fencingToken()));
                  var second = cp.tryAcquire(key, "b", Duration.ofSeconds(5)).orElseThrow();
                  assertTrue(second.fencingToken() > first.fencingToken());
                  assertFalse(cp.release(key, "a", first.fencingToken()));
              }
          }
          EOF
          rm -rf multipaper-api multipaper-server multipaper-master multipaper-mastermessagingprotocol
          rm -f DEVELOPING_A_MULTISERVER_PLUGIN.md assets/multifolia-diagram.jpg
          rmdir assets 2>/dev/null || true
          test -d folia-api
          test -d folia-server
          test -d folia-checkstyle
          test -d build-data
          test ! -d multipaper-api
          test ! -d multipaper-server
          test ! -d multipaper-master
          test ! -d multipaper-mastermessagingprotocol
          grep -q '^mcVersion=26.2$' gradle.properties
          grep -q '^apiVersion=26.2$' gradle.properties
          grep -q '^paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746$' gradle.properties
          grep -Rql 'RegionScheduler' folia-api folia-server
          ./gradlew applyAllPatches --stacktrace
          ./gradlew build --stacktrace
          if grep -RniE 'multipaper|MultiPaper|MULTIPAPER' . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build; then
            echo 'Forbidden MultiPaper reference remains'
            exit 1
          fi
          mkdir -p .github/workflows
          cat > .github/workflows/build.yml <<'EOF'
          name: Build MultiFolia
          on: [push, pull_request, workflow_dispatch]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v5
                  with:
                    distribution: temurin
                    java-version: '25'
                - uses: gradle/actions/setup-gradle@v4
                - run: git config --global user.email 'no-reply@github.com'
                - run: git config --global user.name 'MultiFolia Automation'
                - run: ./gradlew applyAllPatches --stacktrace
                - run: ./gradlew build --stacktrace
                - uses: actions/upload-artifact@v4
                  with:
                    name: multifolia
                    path: |
                      folia-server/build/libs/*.jar
                      folia-api/build/libs/*.jar
          EOF
          rm -rf .github/multifolia
          git add -A
          git commit -m 'Materialize official Folia 26.2 tree' || true
          git push origin HEAD:conversion/folia-26.2
