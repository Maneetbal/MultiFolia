name: Materialize Folia 26.2 Conversion
on:
  push:
    branches: [conversion/folia-26.2]
  workflow_dispatch:
concurrency:
  group: multifolia-materialize
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  convert:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: conversion/folia-26.2
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Configure Git identity
        run: |
          git config --global user.email 'no-reply@github.com'
          git config --global user.name 'MultiFolia Automation'
      - name: Import official Folia 26.2.x
        run: |
          set -euo pipefail
          git clone --depth 1 --branch ver/26.2.x https://github.com/PaperMC/Folia.git /tmp/folia
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/folia/ ./
          rm -rf /tmp/folia
      - name: Materialize MultiFolia source layer
        run: |
          set -euo pipefail
          git show origin/main:.github/multifolia/materialize-source.sh > /tmp/materialize-source.sh
          chmod +x /tmp/materialize-source.sh
          /tmp/materialize-source.sh
      - name: Apply Folia patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build Folia 26.2
        run: ./gradlew build --stacktrace
      - name: Verify clean MultiFolia tree
        run: |
          set -euo pipefail
          if grep -RniE 'multipaper|MultiPaper|MULTIPAPER' . --exclude-dir=.git --exclude-dir=.gradle --exclude-dir=build --exclude='bootstrap-pr.yml' --exclude='bootstrap-folia.yml'; then
            echo 'Forbidden MultiPaper reference remains outside temporary migration workflows'
            exit 1
          fi
          test -d folia-api
          test -d folia-server
          test -d folia-checkstyle
          test -d build-data
          test ! -d multipaper-api
          test ! -d multipaper-server
          test ! -d multipaper-master
          test ! -d multipaper-mastermessagingprotocol
          grep -q '^mcVersion=26.2$' gradle.properties
          grep -q '^apiVersion=26.2$' gradle.properties
          grep -q '^paperRef=5d4f9bd0e4f6b1ef70d07feb411580cef7d1a746$' gradle.properties
      - name: Commit verified materialization
        run: |
          git add -A
          git commit -m 'Materialize official Folia 26.2 tree' || true
          git push origin HEAD:conversion/folia-26.2
